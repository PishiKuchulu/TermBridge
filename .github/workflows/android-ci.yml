# TermBridge CI — Prompt 02 foundation.
# This workflow is the authoritative build route until a capable local
# machine proves otherwise: the sandbox Gradle daemon is known to be
# incompatible here, so a local "build passed" claim is never made
# without a CI run to back it. Runs unit tests + debug assemble on
# every push/PR. No release signing, no secret is used in this job.
name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # contents: write is needed only to refresh the rolling
    # "debug-latest" pre-release below (GITHUB_TOKEN, no other secret).
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Explicit sdkmanager install. The android-actions/setup-android@v3
      # action requested the obsolete `tools` package, which cmdline-tools
      # 16.0 no longer provides ("Failed to find package 'tools'").
      - name: Set up Android SDK
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "cmdline-tools;latest" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle (uses the committed wrapper, 8.10.2)
        uses: gradle/actions/setup-gradle@v4
      # The APK is built first and uploaded before the unit tests run,
      # so a red unit-test run still leaves an installable build for
      # triage. It is a DEBUG-signed build (auto debug key), installable
      # on a device; there is no release signing yet.
      - name: Assemble debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee gradle-assemble.log

      # Diagnosis aid: on failure, push the Gradle error lines (no
      # secrets: compiler/test output only) to the throwaway `ci-logs`
      # branch so a red run can be triaged without downloading logs.
      - name: Publish build error log
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/cilog && cd /tmp/cilog
          git init -q && git config user.name ci-logs && git config user.email ci-logs@example.invalid
          grep -E "^e: |^w: .*Unresolved|What went wrong|Execution failed|error:|FAILED" -A3 "$GITHUB_WORKSPACE/gradle-assemble.log" | head -c 60000 > "errors-assemble-$GITHUB_RUN_NUMBER.txt" || true
          git add . && git commit -qm "build errors run $GITHUB_RUN_NUMBER"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci-logs

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TermBridge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee gradle-test.log

      - name: Publish unit-test error log
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/cilog2 && cd /tmp/cilog2
          git init -q && git config user.name ci-logs && git config user.email ci-logs@example.invalid
          grep -E "^e: | FAILED|What went wrong|AssertionError|Exception" -A3 "$GITHUB_WORKSPACE/gradle-test.log" | head -c 60000 > "errors-tests-$GITHUB_RUN_NUMBER.txt" || true
          git add . && git commit -qm "test errors run $GITHUB_RUN_NUMBER"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci-logs-tests

      # Replaces the previous rolling pre-release with this build.
      # Runs only when the unit tests passed, on pushes to main.
      - name: Publish debug APK as the latest pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TermBridge-debug.apk
          gh release delete debug-latest --cleanup-tag --yes || true
          gh release create debug-latest TermBridge-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "TermBridge debug build" \
            --notes "Debug-signed APK built by CI from commit $GITHUB_SHA. Not a release build."

      # Prompt 15: machine-readable test output even on failure,
      # so a red run still yields its XML reports for triage.
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/test-results/testDebugUnitTest/

  # Prompt 15: instrumented suite on an emulator, as a separate
  # job so an emulator failure does not hide the unit-test signal
  # and vice versa. Remediation phase 7: the instrumented run
  # goes through tests/fixture/run-instrumented-with-fixture.sh,
  # which provisions the SSH fixture
  # (tests/fixture/setup-sshd-fixture.sh) and runs the tests in
  # ONE bash process — CI run #17 showed the runner does not
  # carry an exported FIXTURE_PASSWORD from the workflow's
  # script block into the fixture step, so the password must
  # never rely on the runner preserving environment between
  # lines. The 13 implemented SshIntegrationTest cases run
  # against a real OpenSSH server; the 6 remaining cases stay
  # @Ignore'd with specific reasons, and without a fixture the
  # tests skip via Assume. The fixture password is generated
  # per run, used only inside the wrapper, and never committed.
  instrumented:
    runs-on: ubuntu-latest
    # Needed only to push the secret-free triage excerpt branch.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      # Run #22 follow-up: the emulator died at startup with
      # "Not enough space to create userdata partition" (need
      # 7372.80 MB, ~6979 MB free). Free several GB BEFORE any tool
      # is installed: this step runs first so setup-java can
      # re-install only the JDK it needs. df before/after is log
      # evidence. None of these directories are used by this job.
      - name: Free disk space for the emulator
        run: |
          df -h
          sudo rm -rf /opt/hostedtoolcache /usr/share/dotnet /opt/az /usr/local/share/boost /usr/share/swift 2>/dev/null || true
          df -h
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Explicit sdkmanager install. The android-actions/setup-android@v3
      # action requested the obsolete `tools` package, which cmdline-tools
      # 16.0 no longer provides ("Failed to find package 'tools'").
      - name: Set up Android SDK
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "cmdline-tools;latest" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle (uses the committed wrapper, 8.10.2)
        uses: gradle/actions/setup-gradle@v4

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 4096M
          script: bash tests/fixture/run-instrumented-with-fixture.sh

      # Diagnosis aid (secret-free excerpts only: test names, failure
      # messages, the crypto probe line, the fixture sshd log lines the
      # wrapper already prints). The wrapper scrubs the per-run secrets
      # from result files before this runs.
      - name: Publish instrumented triage excerpt
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/cilog3 && cd /tmp/cilog3
          git init -q && git config user.name ci-logs && git config user.email ci-logs@example.invalid
          OUT="instr-$GITHUB_RUN_NUMBER.txt"
          : > "$OUT"
          for f in "$GITHUB_WORKSPACE"/gradle-attempt-*.log; do
            [ -f "$f" ] || continue
            echo "=== $(basename "$f")" >> "$OUT"
            grep -E "CRYPTO_PROBE|GRADLE_ATTEMPT|Starting [0-9]+ tests|FAILED|PASSED|SKIPPED|tests completed|POSTFAIL: sshd|Unknown API|PropertyFetcher" "$f" | grep -v "^[[:space:]]*at " | head -c 20000 >> "$OUT" || true
            echo "--- what went wrong / tail" >> "$OUT"
            grep -E "What went wrong|Process crashed|Test run failed|Instrumentation|INSTRUMENTATION|Exception|crash|ANR|No tests" -A4 "$f" | grep -v "^[[:space:]]*at " | head -c 8000 >> "$OUT" || true
            tail -n 40 "$f" | grep -v "^[[:space:]]*at " >> "$OUT" || true
          done
          echo "=== vnc fixture status" >> "$OUT"
          tail -n 40 /tmp/termbridge-vnc-status.txt >> "$OUT" 2>/dev/null || true
          echo "=== sshd.log tail" >> "$OUT"
          sudo tail -n 60 /tmp/termbridge-sshd-fixture/sshd.log >> "$OUT" 2>/dev/null || true
          echo "=== sshd.log key-user lines" >> "$OUT"
          sudo grep -E "termbridge-key|publickey|Authentication refused|locked|not allowed|userauth|Failed " /tmp/termbridge-sshd-fixture/sshd.log | tail -60 >> "$OUT" 2>/dev/null || true
          echo "=== result xml failures" >> "$OUT"
          find "$GITHUB_WORKSPACE/app/build/outputs/androidTest-results" -name 'TEST-*.xml' 2>/dev/null | while read -r x; do
            grep -h -E "<testcase|<failure|<skipped" -A3 "$x" | head -c 40000 >> "$OUT" || true
          done
          git add . && git commit -qm "instrumented triage run $GITHUB_RUN_NUMBER"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci-logs-instr

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: app/build/outputs/androidTest-results/connected/

      - name: Dump AVD config (duplicate-key probe)
        if: always()
        run: |
          cat /home/runner/.android/avd/test.avd/config.ini || echo "NO_AVD_CONFIG"
          grep -n "hw.cpu.ncore\|hw.ramSize" /home/runner/.android/avd/test.avd/config.ini || true
