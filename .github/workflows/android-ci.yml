# TermBridge CI — Prompt 02 foundation.
# This workflow is the authoritative build route until a capable local
# machine proves otherwise: the sandbox Gradle daemon is known to be
# incompatible here, so a local "build passed" claim is never made
# without a CI run to back it. Runs unit tests + debug assemble on
# every push/PR. No release signing, no secret is used in this job.
name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Explicit sdkmanager install. The android-actions/setup-android@v3
      # action requested the obsolete `tools` package, which cmdline-tools
      # 16.0 no longer provides ("Failed to find package 'tools'").
      - name: Set up Android SDK
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "cmdline-tools;latest" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle (uses the committed wrapper, 8.10.2)
        uses: gradle/actions/setup-gradle@v4
      - name: Run Gradle build
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      # Prompt 15: machine-readable test output even on failure,
      # so a red run still yields its XML reports for triage.
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/test-results/testDebugUnitTest/

  # Prompt 15: instrumented suite on an emulator, as a separate
  # job so an emulator failure does not hide the unit-test signal
  # and vice versa. Remediation phase 7: the instrumented run
  # goes through tests/fixture/run-instrumented-with-fixture.sh,
  # which provisions the SSH fixture
  # (tests/fixture/setup-sshd-fixture.sh) and runs the tests in
  # ONE bash process — CI run #17 showed the runner does not
  # carry an exported FIXTURE_PASSWORD from the workflow's
  # script block into the fixture step, so the password must
  # never rely on the runner preserving environment between
  # lines. The 13 implemented SshIntegrationTest cases run
  # against a real OpenSSH server; the 6 remaining cases stay
  # @Ignore'd with specific reasons, and without a fixture the
  # tests skip via Assume. The fixture password is generated
  # per run, used only inside the wrapper, and never committed.
  instrumented:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      # Run #22 follow-up: the emulator died at startup with
      # "Not enough space to create userdata partition" (need
      # 7372.80 MB, ~6979 MB free). Free several GB BEFORE any tool
      # is installed: this step runs first so setup-java can
      # re-install only the JDK it needs. df before/after is log
      # evidence. None of these directories are used by this job.
      - name: Free disk space for the emulator
        run: |
          df -h
          sudo rm -rf /opt/hostedtoolcache /usr/share/dotnet /opt/az /usr/local/share/boost /usr/share/swift 2>/dev/null || true
          df -h
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Explicit sdkmanager install. The android-actions/setup-android@v3
      # action requested the obsolete `tools` package, which cmdline-tools
      # 16.0 no longer provides ("Failed to find package 'tools'").
      - name: Set up Android SDK
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "cmdline-tools;latest" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle (uses the committed wrapper, 8.10.2)
        uses: gradle/actions/setup-gradle@v4

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 4096M
          script: bash tests/fixture/run-instrumented-with-fixture.sh

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: app/build/outputs/androidTest-results/connected/

      - name: Dump AVD config (duplicate-key probe)
        if: always()
        run: |
          cat /home/runner/.android/avd/test.avd/config.ini || echo "NO_AVD_CONFIG"
          grep -n "hw.cpu.ncore\|hw.ramSize" /home/runner/.android/avd/test.avd/config.ini || true
