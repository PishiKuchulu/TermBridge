# TermBridge CI — Prompt 02 foundation.
# This workflow is the authoritative build route until a capable local
# machine proves otherwise: the sandbox Gradle daemon is known to be
# incompatible here, so a local "build passed" claim is never made
# without a CI run to back it. Runs unit tests + debug assemble on
# every push/PR. No release signing, no secret is used in this job.
name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Explicit sdkmanager install. The android-actions/setup-android@v3
      # action requested the obsolete `tools` package, which cmdline-tools
      # 16.0 no longer provides ("Failed to find package 'tools'").
      - name: Set up Android SDK
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "cmdline-tools;latest" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle (uses the committed wrapper, 8.10.2)
        uses: gradle/actions/setup-gradle@v4
      - name: Run Gradle build
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      # Prompt 15: machine-readable test output even on failure,
      # so a red run still yields its XML reports for triage.
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/test-results/testDebugUnitTest/

  # Prompt 15: instrumented suite on an emulator, as a separate
  # job so an emulator failure does not hide the unit-test signal
  # and vice versa. Remediation phase 7: the script provisions
  # the SSH fixture (tests/fixture/setup-sshd-fixture.sh) before
  # the emulator run, so the 12 implemented SshIntegrationTest
  # cases run against a real OpenSSH server; the 6 remaining
  # cases stay @Ignore'd with specific reasons, and without a
  # fixture the tests skip via Assume. The fixture password is
  # generated per run, used only inside this script, and never
  # committed.
  instrumented:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Explicit sdkmanager install. The android-actions/setup-android@v3
      # action requested the obsolete `tools` package, which cmdline-tools
      # 16.0 no longer provides ("Failed to find package 'tools'").
      - name: Set up Android SDK
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "cmdline-tools;latest" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle (uses the committed wrapper, 8.10.2)
        uses: gradle/actions/setup-gradle@v4

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          script:  |
            FIXTURE_PASSWORD="$(openssl rand -base64 24)"
            export FIXTURE_PASSWORD
            bash tests/fixture/setup-sshd-fixture.sh
            ./gradlew :app:connectedDebugAndroidTest --stacktrace \
              -Pandroid.testInstrumentationRunnerArguments.fixture_host=10.0.2.2 \
              -Pandroid.testInstrumentationRunnerArguments.fixture_port=2222 \
              -Pandroid.testInstrumentationRunnerArguments.fixture_user=termbridge-test \
              -Pandroid.testInstrumentationRunnerArguments.fixture_password="$FIXTURE_PASSWORD"
      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: app/build/outputs/androidTest-results/connected/
