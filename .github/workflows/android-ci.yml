# TermBridge CI — Prompt 02 foundation.
# This workflow is the authoritative build route until a capable local
# machine proves otherwise: the sandbox Gradle daemon is known to be
# incompatible here, so a local "build passed" claim is never made
# without a CI run to back it. Runs unit tests + debug assemble on
# every push/PR. No release signing, no secret is used in this job.
name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # contents: write is needed only to refresh the rolling
    # "debug-latest" pre-release below (GITHUB_TOKEN, no other secret).
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      # Explicit sdkmanager install. The android-actions/setup-android@v3
      # action requested the obsolete `tools` package, which cmdline-tools
      # 16.0 no longer provides ("Failed to find package 'tools'").
      - name: Set up Android SDK
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "cmdline-tools;latest" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle (uses the committed wrapper, 8.10.2)
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      # The APK is built first and uploaded before the unit tests run,
      # so a red unit-test run still leaves an installable build for
      # triage. It is a DEBUG-signed build (auto debug key), installable
      # on a device; there is no release signing yet.
      - name: Assemble debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee gradle-assemble.log

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TermBridge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee gradle-test.log

      # Replaces the previous rolling release with this build. It is NOT a
      # pre-release: GitHub hides pre-releases from the repository sidebar,
      # which made the APK look missing.
      # Runs only when the unit tests passed, on pushes to main.
      - name: Publish debug APK as the latest pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TermBridge-debug.apk
          gh release delete debug-latest --cleanup-tag --yes || true
          # Retry the create: the releases API returned HTTP 502 in
          # runs #63 and #65, and a failed create after the delete
          # above leaves NO release at all. Three attempts, 15 s apart.
          for attempt in 1 2 3; do
            if gh release create debug-latest TermBridge-debug.apk \
              --latest \
              --target "$GITHUB_SHA" \
              --title "TermBridge debug build (latest)" \
              --notes "Debug-signed APK built by CI from commit $GITHUB_SHA. Not a release build."; then
              break
            fi
            echo "gh release create failed (attempt $attempt/3)"
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 15
          done

      # Prompt 15: machine-readable test output even on failure,
      # so a red run still yields its XML reports for triage.
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-reports
          path: app/build/test-results/testDebugUnitTest/

      # Audit #3 item A-08 (partial): Android Lint runs on every
      # push so findings are visible in the job log. It is
      # non-blocking for now (continue-on-error) because the
      # project has no lint baseline yet; promoting it to a
      # gate is a separate owner decision once the backlog of
      # findings is triaged.
      - name: Run Android Lint (non-blocking, A-08)
        continue-on-error: true
        run: ./gradlew :app:lintDebug --stacktrace

  # Prompt 15: instrumented suite on an emulator, as a separate
  # job so an emulator failure does not hide the unit-test signal
  # and vice versa. Remediation phase 7: the instrumented run
  # goes through tests/fixture/run-instrumented-with-fixture.sh,
  # which provisions the SSH fixture
  # (tests/fixture/setup-sshd-fixture.sh) and runs the tests in
  # ONE bash process — CI run #17 showed the runner does not
  # carry an exported FIXTURE_PASSWORD from the workflow's
  # script block into the fixture step, so the password must
  # never rely on the runner preserving environment between
  # lines. The 13 implemented SshIntegrationTest cases run
  # against a real OpenSSH server; the 6 remaining cases stay
  # @Ignore'd with specific reasons, and without a fixture the
  # tests skip via Assume. The fixture password is generated
  # per run, used only inside the wrapper, and never committed.
  instrumented:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
      # Run #22 follow-up: the emulator died at startup with
      # "Not enough space to create userdata partition" (need
      # 7372.80 MB, ~6979 MB free). Free several GB BEFORE any tool
      # is installed: this step runs first so setup-java can
      # re-install only the JDK it needs. df before/after is log
      # evidence. None of these directories are used by this job.
      - name: Free disk space for the emulator
        run: |
          df -h
          sudo rm -rf /opt/hostedtoolcache /usr/share/dotnet /opt/az /usr/local/share/boost /usr/share/swift 2>/dev/null || true
          df -h
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      # Explicit sdkmanager install. The android-actions/setup-android@v3
      # action requested the obsolete `tools` package, which cmdline-tools
      # 16.0 no longer provides ("Failed to find package 'tools'").
      - name: Set up Android SDK
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "cmdline-tools;latest" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle (uses the committed wrapper, 8.10.2)
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 4096M
          script: bash tests/fixture/run-instrumented-with-fixture.sh

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: instrumented-test-reports
          path: app/build/outputs/androidTest-results/connected/

      - name: Dump AVD config (duplicate-key probe)
        if: always()
        run: |
          cat /home/runner/.android/avd/test.avd/config.ini || echo "NO_AVD_CONFIG"
          grep -n "hw.cpu.ncore\|hw.ramSize" /home/runner/.android/avd/test.avd/config.ini || true

  vnc:
    # Item F-03a: VNC proof in its OWN job. The desktop stack
    # (Xvfb + x11vnc) is installed here, on this job's runner —
    # never inside the emulator job, where it hung the run
    # twice and was reverted. The live tests skip everywhere
    # else (TB_VNC_* unset), so this job is the only place
    # they can pass — and it fails if they fail.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "cmdline-tools;latest" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle (uses the committed wrapper, 8.10.2)
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Start the VNC fixture (Xvfb + x11vnc, 800x600)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb x11vnc
          VNC_PASS="$(openssl rand -hex 6)"
          printf '%s' "$VNC_PASS" > /tmp/tb-vnc-pass
          Xvfb :99 -screen 0 800x600x24 &
          sleep 3
          x11vnc -storepasswd "$VNC_PASS" /tmp/tb-vncauth
          x11vnc -display :99 -rfbport 5901 -rfbauth /tmp/tb-vncauth -localhost -forever -shared -bg -o /tmp/tb-x11vnc.log
          sleep 2
          (exec 3<>/dev/tcp/127.0.0.1/5901) && echo "VNC fixture ready"

      - name: Run the live RFB tests
        run: |
          export TB_VNC_HOST=127.0.0.1
          export TB_VNC_PORT=5901
          export TB_VNC_PASS="$(cat /tmp/tb-vnc-pass)"
          ./gradlew :app:testDebugUnitTest --tests "com.pishi.termbridge.RfbLiveTest" --stacktrace
