# TermBridge Gradle properties.
# JVM heap 4g: Compose AAR dexing workers follow the daemon heap; a
# smaller heap has caused mergeExtDex OOM on Compose projects before.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
# AndroidX / Jetpack Compose
android.useAndroidX=true
android.nonTransitiveRClass=true
# Never put signing passwords, API keys, or local paths in this file.
# Release signing is configured only via environment / CI secrets,
# and only when prompt 18 reaches release packaging.
